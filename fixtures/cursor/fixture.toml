# Cursor data. `{config}` is the OS's app settings folder (Library/
# Application Support, .config or AppData/Roaming). Generated, fake content
# only: the database is built from SQL, with zero-filled values.
days_ago = 30

[[file]]
path = "code/webshop/package.json"
content = '{"name": "webshop"}'

# Chat database: VS Code's ItemTable plus Cursor's cursorDiskKV. 3 MB of
# deleted rows leave free pages (below the 256 MB compaction threshold).
[[sqlite]]
path = "{config}/Cursor/User/globalStorage/state.vscdb"
sql = """
CREATE TABLE ItemTable (key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB);
CREATE TABLE cursorDiskKV (key TEXT UNIQUE ON CONFLICT REPLACE, value BLOB);
INSERT INTO ItemTable VALUES ('workbench.fake', '{}');
INSERT INTO cursorDiskKV VALUES ('bubbleId:c1:b1', zeroblob(40000));
INSERT INTO cursorDiskKV VALUES ('bubbleId:c1:b2', zeroblob(20000));
INSERT INTO cursorDiskKV VALUES ('composerData:c1', zeroblob(5000));
INSERT INTO cursorDiskKV VALUES ('agentKv:blob:1', zeroblob(30000));
INSERT INTO cursorDiskKV VALUES ('checkpointId:c1:k1', zeroblob(2000));
INSERT INTO cursorDiskKV VALUES ('inlineDiff:x', zeroblob(1000));
INSERT INTO cursorDiskKV VALUES ('agentKv:deleted', zeroblob(3000000));
DELETE FROM cursorDiskKV WHERE key = 'agentKv:deleted';
"""

[[file]]
path = "{config}/Cursor/User/globalStorage/state.vscdb.backup"
size = 9000

