name: Frontend

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "web/**"
      - "packages/**"
      - "docs/schema/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "app/**"
      - "web/**"
      - "packages/**"
      - "docs/schema/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

env:
  # Astro 7.4 needs Node 22.23.4 or newer.
  NODE_VERSION: "22.23.4"
  ASTRO_TELEMETRY_DISABLED: "1"

jobs:
  frontend:
    name: Typecheck, lint, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated types match docs/schema
        run: |
          pnpm gen:types
          git diff --exit-code -- packages/client/src/generated
      - run: pnpm -r typecheck
      - run: pnpm -r lint
      - run: pnpm --filter @kipple/client test
      - name: Build the app (web assets only, no Tauri bundle)
        run: pnpm --filter app build
      - name: Build the website
        run: pnpm --filter web build

  tauri:
    name: Check the Tauri crate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/src-tauri
    steps:
      - uses: actions/checkout@v7
      - name: Install Tauri's Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev build-essential file patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # tauri::generate_context! embeds app/dist, so the web assets must exist.
      - name: Build the app's web assets
        working-directory: .
        run: |
          pnpm install --frozen-lockfile
          pnpm --filter app build
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri
      - run: cargo fmt --check
      - run: cargo check --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
