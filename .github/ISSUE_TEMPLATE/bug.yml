name: Bug
description: Something does not work as described.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you ran, what you expected and what you got.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: kipple version
      description: Output of `kipple --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [macOS, Linux, Windows, WSL]
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant output. Remove anything personal. Never attach session files or databases.
      render: text
